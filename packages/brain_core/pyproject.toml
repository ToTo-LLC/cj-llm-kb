[project]
name = "brain_core"
version = "0.1.0"
description = "Pure-Python core library for brain. No web/MCP deps."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "filelock>=3.15",
    "anthropic>=0.40",
    # Plan 02 — ingest pipeline
    "httpx>=0.27",
    "trafilatura>=1.12",
    "pymupdf>=1.24",
    "webvtt-py>=0.5",
    "python-docx>=1.1",
    # Plan 24 T2 (D12) — PowerPoint (.pptx) ingest via PptxHandler.
    # First new pip dep since Plan 16 added watchdog. Pure-Python,
    # MIT-licensed; same maintainer (scanny) as python-docx.
    "python-pptx>=0.6",
    "rank-bm25>=0.2.2",
    # Plan 16 Task 35 — cross-process config hot-reload via filesystem watcher.
    # Used by ``brain_core.config.hot_reload.ConfigWatcher``; both brain_api
    # and brain_mcp start their own ConfigWatcher at lifespan startup so
    # ``loader.resolve_config``'s in-memory cache is invalidated as soon as
    # ``<vault>/.brain/config.json`` is rewritten by any process. Symmetric
    # watchdog (no IPC, no signal handlers) — the platform diffs (FSEvents
    # on Mac, ReadDirectoryChangesW on Windows, inotify on Linux) live
    # inside this library, not our code.
    "watchdog>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brain_core"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["brain_core", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "trafilatura"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "webvtt"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "rank_bm25"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "vcr: requires cassette (deferred in Task 21)",
]

[project]
name = "brain"
version = "0.1.0"
description = "LLM-maintained personal knowledge base"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "brain_core",
    "brain_cli",
    "brain_mcp",
    "brain_api",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
brain_core = { workspace = true, editable = false }
brain_cli = { workspace = true, editable = false }
brain_mcp = { workspace = true, editable = false }
brain_api = { workspace = true, editable = false }

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Issue #2: importlib mode imports each test by its absolute path rather
# than mutating sys.path. This eliminates the duplicate ``prompts``
# package collision that used to force brain_api/tests/prompts/ to omit
# its __init__.py (and brain_api's mypy config to set
# explicit_package_bases=true as a workaround).
addopts = "--import-mode=importlib"
# importlib mode no longer auto-adds the rootpath of each test to
# sys.path, so test-only sibling helpers imported by bare module name
# need explicit pythonpath entries. brain_api/tests/_ws_helpers.py is
# imported as ``from _ws_helpers import ...`` by 4 WS chat test files.
pythonpath = ["packages/brain_api/tests"]
markers = [
    "vcr: requires cassette (deferred in Task 21)",
    "slow: slow integration tests (~30s+ each); run with ``pytest -m slow`` or unmarked",
]
# Include the install-script integration tests under scripts/tests/ in
# the default discovery set so ``uv run pytest`` picks them up. The
# tests themselves are gated on platform (skip on non-Mac unless
# BRAIN_INSTALL_SH_CI=1) — see scripts/tests/conftest.py.
testpaths = [
    "packages",
    "scripts/tests",
]

# Plan 16 Task 45 / D33 — let ruff know BRN001 is a real (external) lint code,
# so its `# noqa: BRN001` parser doesn't warn when it sees the pragma in
# source files (the BRN001 hook is enforced separately via pre-commit).
[tool.ruff.lint]
external = ["BRN001"]

# Plan 16 Task 45 / D33 — BRN001 allowlist.
#
# BRN001 flags ``ctx.config`` reads outside the entry-point boundary.
# The list below is the audit result: every site in the codebase that
# legitimately reads ``ctx.config`` because it IS the entry point
# (tools where Config flows in from ``ToolContext``). Adding to this
# list should be deliberate — the goal is to keep the surface where
# Config is read centralized so future refactors don't sprawl.
#
# The rule is enforced via the ``brn001`` pre-commit hook
# (``.pre-commit-config.yaml``), which calls
# ``python -m brain_core._lint.brn001 <staged-files>``. NOT a ruff
# plugin: ruff's custom-rule path is Rust-only (verified 2026-05;
# Astral has no Python plugin API).
[tool.brain-lint.brn001]
allowed-entry-points = [
    # ToolContext entry points — tools where Config legitimately
    # flows in from the outside world via ``ctx.config``.
    "packages/brain_core/src/brain_core/tools/_errors.py",
    "packages/brain_core/src/brain_core/tools/apply_patch.py",
    "packages/brain_core/src/brain_core/tools/bulk_import.py",
    "packages/brain_core/src/brain_core/tools/classify.py",
    "packages/brain_core/src/brain_core/tools/config_get.py",
    "packages/brain_core/src/brain_core/tools/config_set.py",
    "packages/brain_core/src/brain_core/tools/create_domain.py",
    "packages/brain_core/src/brain_core/tools/delete_domain.py",
    "packages/brain_core/src/brain_core/tools/fork_thread.py",
    "packages/brain_core/src/brain_core/tools/ingest.py",
    "packages/brain_core/src/brain_core/tools/list_domains.py",
    "packages/brain_core/src/brain_core/tools/rename_domain.py",
    "packages/brain_core/src/brain_core/tools/repair_config.py",
    "packages/brain_core/src/brain_core/tools/repair_config_apply.py",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=1.3",
    "mypy>=1.11",
    "ruff>=0.6",
    "filelock>=3.15",
    "types-PyYAML>=6.0",
    "types-psutil>=5.9",
    "respx>=0.21",
    "vcrpy>=6.0",
    "pytest-vcr>=1.0",
    "httpx>=0.27",
    "playwright>=1.58.0",
]

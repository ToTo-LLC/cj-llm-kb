# Plan 14 Tasks 7+8 — Playwright e2e on CI (macOS-14 + windows-2022).
#
# WHY THIS EXISTS
# ---------------
# The existing `ci.yml` runs pytest + ruff + mypy on macOS-14 + windows-2022,
# but does NOT run Playwright. Plan 13 Task 6 surfaced the cascade-shadowing
# class of regression that was ONLY catchable via the e2e a11y suite — without
# Playwright in CI, future v5/v6 theme drops repeat the same silent regression.
# Plan 14 D1+D2 (locked 2026-04-29): all Playwright specs run on macOS-14
# + windows-2022. Task 7 landed the macOS-14 leg; Task 8 added windows-2022.
#
# CANONICAL LOCAL RECIPE (lesson 341 + Plan 12+13 refinements)
# -----------------------------------------------------------
# uv writes editable `.pth` shims with the macOS UF_HIDDEN flag; CPython's
# `site.addpackage` silently skips hidden .pth files. The reliable pattern is:
#
#   chflags 0 .venv/lib/python3.12/site-packages/_editable_impl_*.pth \
#     && PYTHONPATH=packages/.../src npx playwright test
#
# Two load-bearing rules from lesson 341:
#   (1) chflags MUST be the immediate prefix of the same command line that
#       runs python (a separate `run:` block re-hides via Spotlight before
#       the next step starts).
#   (2) Do NOT use `uv run` for the test step (it re-syncs and re-hides).
#       The webServer in playwright.config.ts uses `uv run uvicorn` which
#       can't be cleanly dropped without changing shipped infra; the
#       PYTHONPATH escape hatch makes the test runner immune to .pth
#       shadowing regardless.
#
# brain_api BOOTSTRAP
# -------------------
# Playwright's `webServer` block in apps/brain_web/playwright.config.ts
# already starts brain_api against a fresh temp vault per run
# (./scripts/start-backend-for-e2e.sh seeds the vault + execs uvicorn).
# This workflow does NOT start brain_api manually — Playwright owns that
# lifecycle.
name: Playwright

on:
  push:
    branches: [main]
  pull_request:

# Plan 16 D17 / Task 17: Defender SmartScreen pre-step is gated on this var.
# Off by default — `vars.DEFENDER_DISABLE` is unset on the repo, so the `||`
# falls back to `'false'` and the step's `if:` evaluates false. To enable on
# a Defender-flake-affected run, set the `DEFENDER_DISABLE` repository variable
# to `'true'` via Settings → Actions → Variables. Macs have no Defender; the
# step's `runner.os == 'Windows'` clause keeps the matrix's macOS leg untouched
# regardless of the var. No cleanup step — runners are ephemeral.
env:
  DEFENDER_DISABLE: ${{ vars.DEFENDER_DISABLE || 'false' }}

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        # Plan 14 Task 7 lands macos-14. Task 8 added windows-2022.
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Plan 16 D14 / Task 14: cache uv's download + wheel cache. Keyed on
      # the lockfile + every pyproject.toml so any dep change invalidates.
      # Both POSIX (~/.cache/uv) and Windows (%LOCALAPPDATA%\uv\cache) paths
      # are listed; actions/cache@v4 tolerates non-existent paths per OS.
      # Cache MUST stay at workflow level (not in the composite action) so
      # the cache key derives from the workflow's hashFiles context.
      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~\AppData\Local\uv\cache
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock', 'pyproject.toml', 'packages/*/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      # Plan 16 D14 / Task 14: cache pnpm content-addressable store.
      # Default store paths differ by OS; both are listed so the cache
      # action picks whichever exists per runner. Keyed on the workspace
      # pnpm-lock.yaml so dep changes invalidate.
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/pnpm/store/v3
            ~/Library/pnpm/store/v3
            ~\AppData\Local\pnpm\store\v3
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      # Plan 16 D15 / Task 15: composite action consolidates the install +
      # chflags + PYTHONPATH preamble that previously duplicated across
      # the macOS and Windows legs of this workflow. The `pythonpath_separator`
      # input handles the only OS-level difference Python actually cares about
      # (`:` vs `;` for os.pathsep — the path-component separator within
      # PYTHONPATH). Forward slashes inside each component work on Windows
      # because CPython normalizes paths internally; not splitting on
      # backslashes also keeps this YAML clean of `'\'`-style escape concerns.
      # The chflags step inside the composite is gated on
      # runner.os == 'macOS'. The workflow keeps its own chflags prefix on
      # the actual `npx playwright test` line below as belt-and-suspenders
      # per lesson 341 (the canonical recipe colocates chflags with the
      # python invocation; the composite's chflags is best-effort cleanup
      # right after uv sync, the workflow's chflags is the load-bearing one
      # immediately before the test runner).
      - name: Setup brain test environment
        uses: ./.github/actions/setup-brain-test-env
        with:
          pythonpath_separator: ${{ runner.os == 'Windows' && ';' || ':' }}

      # Plan 16 D13 / Task 13: stylelint CSS gate (fail-fast, before
      # the slower web build + Playwright install). Enforces "no
      # hardcoded hex outside :root / [data-theme] / [data-density]
      # token-definition blocks" — see apps/brain_web/.stylelintrc.json
      # and the convention block at the top of brand-skin.css. Runs on
      # both Mac + Windows legs (`pnpm` is shell-agnostic; no chflags
      # needed because no Python .pth files involved).
      - name: Lint CSS (stylelint)
        run: pnpm --filter brain_web stylelint

      - name: Build static UI bundle (apps/brain_web/out/)
        # The brain_api single-port mount serves apps/brain_web/out/ at /;
        # Playwright drives http://localhost:4317. Bundle must exist before
        # webServer boots. globalSetup will rebuild if missing, but doing it
        # explicitly here keeps the failure mode obvious in CI logs.
        run: pnpm --filter brain_web build

      # Plan 16 D14 / Task 14: cache the Playwright browser binaries.
      # Mac default: ~/Library/Caches/ms-playwright; Linux: ~/.cache/ms-playwright;
      # Windows: %USERPROFILE%\AppData\Local\ms-playwright. All three paths are
      # listed; actions/cache@v4 ignores non-existent paths per OS. Keyed on
      # the pnpm-lock.yaml hash because that captures the resolved
      # @playwright/test version (bumping it invalidates the browser cache).
      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/ms-playwright
            ~/.cache/ms-playwright
            ~\AppData\Local\ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # Plan 16 D17 / Task 17: opt-in Defender real-time-monitoring disable
      # for Windows Playwright runs that hit SmartScreen flakes on the
      # browser binary download / launch path. Off by default (the workflow
      # `env: DEFENDER_DISABLE` falls back to `'false'` when the repo var is
      # unset; the if-gate then evaluates false and this step is a no-op).
      # Mac runners don't have Defender, so the `runner.os == 'Windows'`
      # clause keeps the matrix's macOS leg untouched even if the var is set.
      # Runners are ephemeral; no cleanup step needed.
      - name: Disable Defender real-time monitoring (Windows only, feature-flagged)
        if: env.DEFENDER_DISABLE == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
          Write-Host "Defender real-time monitoring disabled per DEFENDER_DISABLE workflow var."

      # On a cache hit we still need the Linux apt deps that --with-deps
      # supplies — but hosted macos-14 + windows-2022 runners have nothing
      # to install on the system side, so the gate is straightforward:
      # skip entirely when the browser cache already populated the path.
      - name: Install Playwright browsers (chromium + system deps)
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: pnpm --filter brain_web exec playwright install --with-deps chromium

      # --- Run e2e suite (macOS) -----------------------------------------
      # Lesson 341 canonical recipe: chflags clamp on BOTH .pth files
      # in the SAME command line as `npx playwright test`. The PYTHONPATH
      # escape hatch (set via $GITHUB_ENV by the setup-brain-test-env
      # composite action above) makes the test runner immune to .pth
      # shadowing even if uv re-hides mid-run (the webServer's
      # `uv run uvicorn` triggers auto-sync). Glob covers
      # `_editable_impl_brain_core.pth` plus any numbered duplicates uv
      # accumulated across syncs.
      #
      # I1 TRAP CLOSURE (Plan 14 Task 8 review note from Task 7):
      # this step is intentionally Mac-only because chflags is a BSD/macOS
      # syscall — running it on Windows errors out. The Windows leg gets a
      # sibling `if: runner.os == 'Windows'` step below. Without this split
      # the windows-2022 matrix entry would silently skip the only step
      # that runs Playwright (every preceding step would pass; CI would go
      # green with zero Windows e2e coverage). Option B from the Task 8
      # review (sibling-step model) over Option C (one bash step with
      # conditional chflags) because PowerShell is the natural shell on
      # windows-2022 and matches `start-backend-for-e2e.ps1`.
      #
      # Plan 16 D15 / Task 15: PYTHONPATH is now exported by the
      # setup-brain-test-env composite action via $GITHUB_ENV, so the
      # step-level `env: PYTHONPATH:` block was removed (would have just
      # restated what's already inherited). The composite already runs a
      # best-effort chflags clear right after `uv sync`; the inline
      # chflags below remains because lesson 341 requires it on the SAME
      # command line as the python invocation (Spotlight may re-hide
      # between the composite's chflags and this step's runner).
      - name: Playwright e2e (full suite, macOS)
        if: runner.os == 'macOS'
        working-directory: apps/brain_web
        env:
          CI: "true"
        run: |
          chflags 0 "${{ github.workspace }}"/.venv/lib/python3.12/site-packages/_editable_impl_*.pth 2>/dev/null || true
          npx playwright test

      # --- Run e2e suite (Windows) ---------------------------------------
      # Windows-specific notes:
      # - No chflags equivalent. uv on Windows writes plain .pth files (no
      #   UF_HIDDEN flag, no Spotlight re-hide loop), so the editable
      #   installs are visible to CPython's site.addpackage out of the box.
      # - PYTHONPATH separator on Windows is `;` (not `:`). Python's
      #   `os.pathsep` switches on platform; CI must respect it. The
      #   setup-brain-test-env composite action above sets PYTHONPATH via
      #   $GITHUB_ENV using the `pythonpath_separator` input so this step
      #   inherits it correctly. Forward-slash path components inside each
      #   PYTHONPATH entry work on Windows because CPython normalizes paths.
      # - Shell is `pwsh` (PowerShell 7) — preinstalled on windows-2022 and
      #   what playwright.config.ts's webServer command uses to invoke
      #   start-backend-for-e2e.ps1.
      # - `npx playwright test` works the same on Windows; npx is provided
      #   by the actions/setup-node@v4 step above.
      # - `--with-deps` for `playwright install` is a no-op on Windows
      #   (only Linux apt deps are involved); harmless to keep above.
      # - Defender SmartScreen historically does not interfere with the
      #   Playwright browser binaries on hosted windows-2022 runners. If it
      #   ever does, Plan 16 Task 17 / D17 added an opt-in pre-step above
      #   (gated on the `DEFENDER_DISABLE` repo var) that runs
      #   `Set-MpPreference -DisableRealtimeMonitoring $true`. Off by
      #   default to keep CI logs clean; flip the var when needed.
      - name: Playwright e2e (full suite, Windows)
        if: runner.os == 'Windows'
        working-directory: apps/brain_web
        shell: pwsh
        env:
          CI: "true"
        run: |
          npx playwright test

      # --- Diagnostics on failure ----------------------------------------
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            apps/brain_web/playwright-report
            apps/brain_web/test-results
          retention-days: 7

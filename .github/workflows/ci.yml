name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Plan 16 D14 / Task 14: cache uv's download + wheel cache. Keyed on
      # the lockfile + every pyproject.toml so any dep change invalidates.
      # Both POSIX (~/.cache/uv) and Windows (%LOCALAPPDATA%\uv\cache) paths
      # are listed; actions/cache@v4 tolerates non-existent paths per OS.
      # Cache MUST stay at workflow level (not in the composite action) so
      # the cache key derives from the workflow's hashFiles context.
      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~\AppData\Local\uv\cache
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock', 'pyproject.toml', 'packages/*/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      # Plan 16 D15 / Task 15: composite action consolidates the uv install
      # + sync recipe shared with playwright.yml. ci.yml is Python-only —
      # `install_pnpm: false` skips Node/pnpm setup, `set_pythonpath: false`
      # skips the PYTHONPATH escape hatch (pytest discovers packages via
      # the workspace .venv directly).
      - name: Setup brain test environment
        uses: ./.github/actions/setup-brain-test-env
        with:
          install_pnpm: "false"
          set_pythonpath: "false"

      - name: Lint
        run: uv run ruff check .

      # Plan 16 D33 / Task 46: BRN001 hard-fail gate. The standalone AST
      # checker (Plan 16 T45 — `packages/brain_core/src/brain_core/_lint/
      # brn001.py`) flags ``ctx.config`` reads outside the allowlisted
      # entry-points list (declared in `[tool.brain-lint.brn001]`).
      # Pre-commit catches local edits; this CI step catches anything
      # that bypasses pre-commit (commits via the GitHub UI, force-pushes
      # that skip hooks). Hard-fail — `set -e` is implicit per GHA's
      # step contract; a non-zero exit fails the run.
      #
      # Plan-author drift adjudicated at T45 (verified 2026-05): ruff has
      # no Python plugin API, so the spec's wording "ruff check . --select
      # BRN001" was structurally impossible. The standalone AST module
      # is the equivalent and matches the actionlint hook shape from T16.
      - name: BRN001 (ctx.config allowlist)
        shell: bash
        run: |
          # ``find ... -exec ... {} +`` aggregates all matched paths into a
          # single invocation — handles spaces in paths safely (no shell
          # word-split on $files) and works the same under Git Bash on
          # Windows runners. If no Python files exist, find emits nothing
          # and the -exec is a no-op (exit 0).
          find packages/brain_core/src packages/brain_api/src packages/brain_mcp/src packages/brain_cli/src apps/brain_web/scripts \
            -name '*.py' \
            -exec uv run python -m brain_core._lint.brn001 {} +

      - name: Type-check brain_core
        run: uv run mypy packages/brain_core/src

      - name: Test
        run: uv run pytest packages/brain_core --cov=brain_core --cov-report=term-missing

      # Plan 17 Task 1: brain_api → AnthropicProvider e2e integration test.
      # Boots the production lifespan with a real ``ANTHROPIC_API_KEY`` and
      # round-trips ``brain_ping_llm`` through the full
      # ``create_app → AnthropicProvider → AsyncAnthropic → live API`` path.
      #
      # Two-layer gating:
      #
      # 1. ``if: github.event_name == 'push' && github.ref ==
      #    'refs/heads/main'`` — never run on pull requests. Forks (and
      #    branch PRs) cannot read repo secrets, so a PR-time run would
      #    always behave as "no key" → silent no-op. Pinning to
      #    main-pushes makes the contract explicit (the secret is only
      #    in scope for trusted commits), AND avoids the surprise of
      #    integration tests blocking PR merges on transient API issues.
      # 2. Inline bash ``[ -z "${ANTHROPIC_API_KEY}" ]`` — within the
      #    main-push window, still no-op if the
      #    ``ANTHROPIC_TEST_API_KEY`` repo secret hasn't been set. GHA
      #    expressions can't read ``secrets.*`` in ``if:`` clauses for
      #    security reasons (they'd leak into the workflow context); the
      #    standard pattern is to surface the secret as an env var,
      #    which renders as the empty string when unset, then guard
      #    inside the script.
      #
      # When the test ITSELF fails (key set, real call fails), the step
      # fails — that's the point of the integration gate.
      - name: Integration test (Anthropic e2e)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        # Plan 17 T1 review nit: cap step at 5min so a stuck TCP connection
        # to api.anthropic.com doesn't hang the whole job. AsyncAnthropic's
        # 60s default timeout applies per call; this is the step-level
        # backstop for "all 3 calls hang at once" or similar pathologies.
        timeout-minutes: 5
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_TEST_API_KEY }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "ANTHROPIC_TEST_API_KEY secret not set; skipping integration test."
            exit 0
          fi
          uv run pytest packages/brain_api/tests/test_anthropic_e2e.py -q

      # Plan 16 D18 / Task 18: per-step wall-clock observability. Queries the
      # current workflow run's jobs API (gh api), parses with jq, and writes a
      # Markdown table to $GITHUB_STEP_SUMMARY so reviewers can scan step
      # timings + statuses without drilling into raw logs. Mac vs Windows
      # comparison appears as adjacent rows in the same workflow-run summary
      # because both matrix legs append to their own job's summary surface
      # (the run UI aggregates summaries across all jobs in a run).
      #
      # Caveats:
      # - This step is the LAST step in the job, so its OWN duration won't
      #   appear (the API call happens before this step's completed_at is
      #   recorded). That's acceptable per D18 — losing the summary step's
      #   own row is fine.
      # - `if: always()` so the summary fires even when a prior step failed.
      #   A failure summary is more valuable than no summary.
      # - `set +e` + `|| true` so a transient gh/jq failure does NOT fail the
      #   job. This is observability, not a gate.
      # - `shell: bash` is cross-platform — pwsh on windows-2022 has bash
      #   available via Git Bash; gh + jq are preinstalled on both runners.
      - name: Write CI duration summary
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          jobs_json=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" --paginate)
          {
            echo "## CI duration summary"
            echo ""
            echo "| Job | Step | Duration | Status |"
            echo "|---|---|---|---|"
            echo "$jobs_json" | jq -r '
              .jobs[] |
              . as $job |
              .steps[]? |
              "| \($job.name) | \(.name) | \(
                if .completed_at and .started_at then
                  ((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)) | tostring + "s"
                else
                  "—"
                end
              ) | \(.conclusion // "—") |"
            '
          } >> "$GITHUB_STEP_SUMMARY" || true
